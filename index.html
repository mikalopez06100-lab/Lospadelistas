<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1622" />
    <meta name="description" content="Padel arcade à une main : joue avec les vitres." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rebote" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Rebote</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="vignette"></div>
    <div id="hud">
      <button id="btn-menu" type="button" aria-label="Menu">☰</button>
      <button id="btn-sound" type="button" aria-label="Son">🔊</button>
      <button id="btn-replay" type="button" title="Relancer le dernier coup">↺</button>
      <button id="btn-lob" type="button">Lob</button>
      <button id="btn-debug" type="button">Dbg</button>
      <button id="btn-settings" type="button" aria-label="Réglages">⚙</button>
    </div>
    <div id="score"></div>
    <div id="feedback"></div>
    <div id="hint"></div>

    <div id="over" class="hidden">
      <h2 id="over-title"></h2>
      <p id="over-text"></p>
      <p id="over-style"></p>
      <div class="row">
        <button id="btn-again" type="button" class="primary">Rejouer</button>
        <button id="btn-over-menu" type="button">Menu</button>
      </div>
    </div>

    <div id="home">
      <div class="home-inner">
        <h1>Rebote</h1>
        <p class="tagline">Joue avec les vitres.</p>

        <div class="group">
          <span class="label">Adversaires</span>
          <div class="segmented" id="seg-level">
            <button type="button" data-value="facile">Facile</button>
            <button type="button" data-value="moyen">Moyen</button>
            <button type="button" data-value="fort">Fort</button>
          </div>
        </div>
        <div class="group">
          <span class="label">Format</span>
          <div class="segmented" id="seg-format">
            <button type="button" data-value="1">1 jeu · 3 min</button>
            <button type="button" data-value="3">3 jeux · 10 min</button>
          </div>
        </div>

        <button id="btn-play" type="button" class="primary big">Jouer</button>
        <button id="btn-resume" type="button" class="hidden">Reprendre le match</button>
        <p id="best"></p>

        <div class="row options">
          <button id="opt-sound" type="button"></button>
          <button id="opt-haptics" type="button"></button>
          <button id="opt-lob" type="button"></button>
        </div>
        <div class="row options">
          <button id="opt-sandbox" type="button">Bac à sable</button>
          <button id="opt-settings" type="button">Réglages</button>
          <button id="opt-debug" type="button"></button>
        </div>
        <button id="btn-install" type="button" class="hidden">Installer l’appli</button>
        <p id="install-hint" class="hidden">Sur iPhone : bouton Partager, puis « Sur l’écran d’accueil ».</p>
        <p class="howto">Ton joueur se place tout seul. Quand l’anneau vert s’allume sous lui, swipe vers le haut : la direction vise, la vitesse dose.</p>
      </div>
    </div>

    <div id="panel" class="hidden"></div>
    <div id="rotate">Tourne ton téléphone en portrait</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
